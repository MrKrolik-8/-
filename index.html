<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Doom</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #dos {
      width: 100%;
      height: 100%;
      display: none;
    }
    #start-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: monospace;
      font-size: 2em;
      cursor: pointer;
      z-index: 10;
      user-select: none;
    }
    #start-screen:hover {
      color: #ff4444;
    }
  </style>
</head>
<body>
  <div id="dos"></div>

  <div id="start-screen">Click to Play</div>

  <script src="js-dos.js"></script>
  <script>
    document.getElementById("start-screen").addEventListener("click", function () {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("dos").style.display = "block";

      // Unlock browser audio on user gesture
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        const ctx = new AudioCtx();
        if (ctx.state === "suspended") ctx.resume();
      }

      Dos(document.getElementById("dos"), {
        url: "doom.jsdos",
        pathPrefix: "/doom-site/"
      });
    });
  </script>
</body>
</html>
